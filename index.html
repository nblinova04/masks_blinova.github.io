<!DOCTYPE html>
<html>

<head>
    <script src="aframe.min.js"></script>
    <script src="zappar-aframe\zappar-aframe.js"></script>

    <meta charset="utf-8" />
    <title>Zappar for A-Frame: Face Tracking Face Mesh Example</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #mask3dButton {
            position: fixed;
            z-index: 9999;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #222;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #mask3dButton:active {
            transform: translateX(-50%) scale(0.95);
        }
    </style>
</head>

<body>
    <button id="mask3dButton">
        3D маска
    </button>
    <a-scene>
    <a-entity zappar-permissions-ui id="permissions"></a-entity>
    <a-entity zappar-compatibility-ui id="compatibility"></a-entity>

    <a-camera zappar-camera="user-facing: true;"></a-camera>

    <a-entity zappar-face id="face-anchor">

        <a-plane
            position="0.4 -0.2 0.04"
            scale="1 1 1"
            rotation="0 0 0"
            width="0.8"
            height="1"
            material="src: url(assets/mask.png);
                     transparent: true;
                     alphaTest: 0.01;">
        </a-plane>

    </a-entity>
</a-scene>

<script>
document
.getElementById("mask3dButton")
.addEventListener("click", function () {
    window.location.href = "js3d/index.html";
    });
    </script>
</body>

</html>
