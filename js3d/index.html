<!DOCTYPE html>
<html>

<head>
    <script src="aframe.min.js"></script>
    <script src="zappar-aframe\zappar-aframe.js"></script>

    <meta charset="utf-8" />
    <title>Zappar for A-Frame: Face Tracking 3D Model Example</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #mask2dButton {
            position: fixed;
            z-index: 9999;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #222;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #mask2dButton:active {
            transform: translateX(-50%) scale(0.95);
        }
    </style>
</head>

<body>
    <button id="mask2dButton">
        2D маска
    </button>
    <a-scene>
        <!-- Ask user for camera permissions, display some text if permission is denied -->
        <a-entity zappar-permissions-ui id="permissions"></a-entity>
        <!-- shows a full-page dialog that informs the user they're using an unsupported browser -->
        <a-entity zappar-compatibility-ui id="compatibility"></a-entity>

        <a-camera zappar-camera="user-facing: true;" />

        <!-- Setup our face tracker -->
        <a-entity zappar-face id="my-face-tracker">

            <!-- Include a head mask object that will make sure the user's head appears in the center of our helmet -->
            <a-entity zappar-head-mask="face:#my-face-tracker;"></a-entity>

            <!-- Include a 3D model inside our face tracker -->
            <a-entity gltf-model="url(assets/spider-man-mask.glb)" position="0 -1.7 0.3"
        rotation="0 0 0"
        scale="1.5 1.5 1.5"></a-entity>

        </a-entity>
    </a-scene>

    <script>
document
.getElementById("mask2dButton")
.addEventListener("click", function () {
    window.location.href = "../index.html";
    });
    </script>

</body>

</html>
